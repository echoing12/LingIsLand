name: Release DMG

# 打 v* tag（如 v0.1.0）时自动构建 DMG 并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: |
          cd LingIsland
          ./scripts/make_dmg.sh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: LingIsland/dist/*.dmg
          generate_release_notes: true
